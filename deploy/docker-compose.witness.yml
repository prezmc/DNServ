# A DNServ witness: run it on a third machine when you have two DNServ
# nodes, so changes keep working while either node is down. It only votes
# in the cluster: it answers no DNS and has no dashboard, so it needs very
# little (a Raspberry Pi or a NAS is plenty).
#
# 1. On a DNServ node, open Cluster and make a join code.
# 2. Put it below and run `docker compose -f docker-compose.witness.yml up -d`.
#    The code is used once; after joining, the witness ignores it.
services:
  dnserv-witness:
    image: ghcr.io/prezmc/dnserv:latest
    container_name: dnserv-witness
    restart: unless-stopped
    ports:
      - "8081:8081/tcp"   # node-to-node (clustering)
    volumes:
      - dnserv-witness-data:/data
    environment:
      - DNSERV_ROLE=witness
      - DNSERV_JOIN=DNSJ1-paste-your-join-code-here
      # - DNSERV_NODE_NAME=witness-pi

volumes:
  dnserv-witness-data:
