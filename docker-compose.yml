# Single node: `docker compose up -d`, then open http://<host>:8080.
# No config files needed; settings live in the dnserve-data volume.
services:
  dnserve:
    image: prezmcmahon/dnserve:latest
    container_name: dnserve
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "853:853/tcp"     # DNS over TLS for your devices
      - "8080:8080/tcp"   # health, metrics (dashboard in step 1c)
      # DNS over HTTPS. Uncomment if nothing else on the host uses 443,
      # or map another host port, e.g. "8443:443/tcp".
      # - "443:443/tcp"
    volumes:
      - dnserve-data:/data
    environment:
      - TZ=America/Chicago

volumes:
  dnserve-data:
