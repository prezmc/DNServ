# Single node: `docker compose up -d`, then open http://<host>:8080.
# No config files needed; settings live in the dnserv-data volume.
services:
  dnserv:
    image: ghcr.io/prezmc/dnserv:latest
    container_name: dnserv
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "853:853/tcp"     # DNS over TLS for your devices
      - "8080:8080/tcp"   # dashboard, setup wizard, health and metrics
      - "8081:8081/tcp"   # node-to-node (clustering); only other DNServ nodes need it
      # DNS over HTTPS. Uncomment if nothing else on the host uses 443,
      # or map another host port, e.g. "8443:443/tcp".
      # - "443:443/tcp"
    volumes:
      - dnserv-data:/data
    environment:
      - TZ=America/Chicago   # your time zone, used by schedules

volumes:
  dnserv-data:
