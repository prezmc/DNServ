name: CI

# All jobs start at once (none waits for another), so a run takes as long
# as its slowest job. Go's module and build caches are kept per job and
# refreshed by every run on main, so pull requests start warm. A new push
# to a pull request cancels the run it replaces. Changes to documentation
# only (docs/, site/, Markdown) skip CI.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "site/**", "**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["docs/**", "site/**", "**.md", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Caches are saved only from main (pull requests read them), so the
  # repository's cache space isn't filled with one copy per branch.
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  checks:
    # Formatting, go vet, govulncheck and a quick benchmark run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - &restore-go-cache
        name: Restore Go cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-${{ github.job }}-${{ steps.go.outputs.go-version }}-
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Benchmarks (smoke)
        run: go test -run '^$' -bench . -benchtime 200ms ./internal/...
      - &save-go-cache
        name: Save Go cache
        if: env.SAVE_CACHE == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - *restore-go-cache
      - name: Install Unbound (for the recursive-mode integration test)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q unbound dns-root-data
          sudo systemctl disable --now unbound || true
          # Ubuntu's AppArmor profile confines /usr/sbin/unbound to its own
          # directories, so it can't read a config in the test's temp dir.
          # The DNServ image (Alpine) has no such profile.
          if [ -f /etc/apparmor.d/usr.sbin.unbound ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.unbound || true
          fi
      - name: Install Pebble (Let's Encrypt's test server, for the certificate tests)
        run: GOBIN=$RUNNER_TEMP/bin go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.3
      - run: go test -race ./...
        env:
          PEBBLE_BIN: ${{ runner.temp }}/bin/pebble
      - *save-go-cache

  browser:
    # The dashboard in Chromium against a real node: setup wizard, rules,
    # lists, local names, pause, query log, backups, users. See
    # test/browser and docs/testing.md.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - *restore-go-cache
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/browser/package-lock.json
      - name: Build the node
        run: go build -o dnserv-browser-test ./cmd/dnserv
      - name: Install Playwright and Chromium
        working-directory: test/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: test/browser
        env:
          BROWSER_SHOTS: ${{ runner.temp }}/browser-shots
        run: node --test
      - name: Screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures
          path: ${{ runner.temp }}/browser-shots
          if-no-files-found: ignore
      - *save-go-cache

  failover:
    # Real containers: two nodes and a witness, broken on purpose while a
    # client sends DNS nonstop. See test/failover. Building the image here
    # also checks that the Dockerfile builds.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - *restore-go-cache
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dnserv:failover-test
          cache-from: type=gha,scope=ci-image
          cache-to: ${{ env.SAVE_CACHE == 'true' && 'type=gha,mode=max,scope=ci-image' || '' }}
      - name: Failover tests
        env:
          DNSERV_IMAGE: dnserv:failover-test
          FAILOVER_REPORT: ${{ runner.temp }}/failover.md
        run: go test -tags failover -v -timeout 25m ./test/failover/
      - name: Results
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/failover.md" ]; then
            { echo "## Failover tests"; cat "$RUNNER_TEMP/failover.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - *save-go-cache
