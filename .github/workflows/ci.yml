name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Install Unbound (for the recursive-mode integration test)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q unbound dns-root-data
          sudo systemctl disable --now unbound || true
      - run: go test -race ./...
      - name: Benchmarks (smoke)
        run: go test -run '^$' -bench . -benchtime 200ms ./internal/...

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dnserve:ci
