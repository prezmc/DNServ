name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Install Unbound (for the recursive-mode integration test)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q unbound dns-root-data
          sudo systemctl disable --now unbound || true
          # Ubuntu's AppArmor profile confines /usr/sbin/unbound to its own
          # directories, so it can't read a config in the test's temp dir.
          # The DNServe image (Alpine) has no such profile.
          if [ -f /etc/apparmor.d/usr.sbin.unbound ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.unbound || true
          fi
      - run: go test -race ./...
      - name: Benchmarks (smoke)
        run: go test -run '^$' -bench . -benchtime 200ms ./internal/...

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: dnserve:ci
