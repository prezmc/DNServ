name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Install Unbound (for the recursive-mode integration test)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q unbound dns-root-data
          sudo systemctl disable --now unbound || true
          # Ubuntu's AppArmor profile confines /usr/sbin/unbound to its own
          # directories, so it can't read a config in the test's temp dir.
          # The DNServ image (Alpine) has no such profile.
          if [ -f /etc/apparmor.d/usr.sbin.unbound ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.unbound || true
          fi
      - name: Install Pebble (Let's Encrypt's test server, for the certificate tests)
        run: GOBIN=$RUNNER_TEMP/bin go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.3
      - run: go test -race ./...
        env:
          PEBBLE_BIN: ${{ runner.temp }}/bin/pebble
      - name: Benchmarks (smoke)
        run: go test -run '^$' -bench . -benchtime 200ms ./internal/...

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: dnserv:ci

  browser:
    # The dashboard in Chromium against a real node: setup wizard, rules,
    # lists, local names, pause, query log, backups, users. See
    # test/browser and docs/testing.md.
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/browser/package-lock.json
      - name: Build the node
        run: go build -o dnserv-browser-test ./cmd/dnserv
      - name: Install Playwright and Chromium
        working-directory: test/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: test/browser
        env:
          BROWSER_SHOTS: ${{ runner.temp }}/browser-shots
        run: node --test
      - name: Screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures
          path: ${{ runner.temp }}/browser-shots
          if-no-files-found: ignore

  failover:
    # Real containers: two nodes and a witness, broken on purpose while a
    # client sends DNS nonstop. See test/failover.
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build image
        run: docker build -t dnserv:failover-test .
      - name: Failover tests
        env:
          DNSERV_IMAGE: dnserv:failover-test
          FAILOVER_REPORT: ${{ runner.temp }}/failover.md
        run: go test -tags failover -v -timeout 25m ./test/failover/
      - name: Results
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/failover.md" ]; then
            { echo "## Failover tests"; cat "$RUNNER_TEMP/failover.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi
