# Deploys the receiver for the opt-in weekly usage summary
# (deploy/stats-worker) to Cloudflare. See docs/usage-stats.md.
#
# One-time setup, under the repo's Settings > Secrets and variables >
# Actions:
#   secret   CLOUDFLARE_API_TOKEN   "Edit Cloudflare Workers" template + D1 Edit
#   secret   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard
#   variable STATS_DOMAIN           optional, e.g. stats.dnserv.dev (its DNS
#                                   must be on Cloudflare); without it the
#                                   worker answers on its workers.dev name
# Until the secrets exist, this does nothing.
name: Usage stats receiver

on:
  push:
    branches: [main]
    paths: [deploy/stats-worker/**, .github/workflows/stats-worker.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stats-worker
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/stats-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/stats-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STATS_DOMAIN: ${{ vars.STATS_DOMAIN }}
    steps:
      - name: Check the Cloudflare secrets
        id: ready
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets aren't set yet, so the usage stats receiver wasn't deployed. See docs/usage-stats.md."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@v7
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: steps.ready.outputs.go == 'true'
        run: npm ci --ignore-scripts
      - name: Create the database the first time
        if: steps.ready.outputs.go == 'true'
        run: |
          id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s).find(x=>x.name==="dnserv-stats");process.stdout.write(d?d.uuid:"")})')
          if [ -z "$id" ]; then
            npx wrangler d1 create dnserv-stats
            id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{process.stdout.write(JSON.parse(s).find(x=>x.name==="dnserv-stats").uuid)})')
          fi
          sed -i "s/DATABASE_ID/$id/" wrangler.toml
          if [ -n "$STATS_DOMAIN" ]; then
            # Only the custom name: a workers.dev name needs registering
            # by hand first, and nothing should use it.
            sed -i 's/^workers_dev = true/workers_dev = false/' wrangler.toml
            printf '\n[[routes]]\npattern = "%s"\ncustom_domain = true\n' "$STATS_DOMAIN" >> wrangler.toml
          fi
      - name: Update the tables
        if: steps.ready.outputs.go == 'true'
        run: npx wrangler d1 migrations apply dnserv-stats --remote
      - name: Deploy
        if: steps.ready.outputs.go == 'true'
        run: npx wrangler deploy
