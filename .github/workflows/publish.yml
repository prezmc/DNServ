name: Publish image

# Builds multi-arch images (amd64, arm64) and pushes them to GitHub
# Container Registry as ghcr.io/prezmc/dnserv. That needs no setup.
#
#   every push to main     -> :latest            (the "every change" channel)
#   a release (tag v1.2.3) -> :1.2.3, :1.2, :stable (the "releases" channel)
#   both                   -> :sha-<commit>      (used for rollbacks)
#
# Releases are made with the Release workflow (see docs/releasing.md), which
# starts this one for the new tag.
# Optional: also push to Docker Hub as <DOCKERHUB_USERNAME>/dnserv by adding
# repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (see
# docs/releasing.md). A DOCKERHUB_IMAGE repository variable overrides the name.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One publish at a time, so an older run can't overwrite "latest" after a
# newer one.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image names
        id: names
        env:
          # Docker Hub image goes under the account that owns the token,
          # unless a DOCKERHUB_IMAGE repository variable names another
          # (for example an organization: myorg/dnserv).
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/dnserv', secrets.DOCKERHUB_USERNAME) }}
        run: |
          echo "images<<EOF" >> "$GITHUB_OUTPUT"
          echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dnserv" >> "$GITHUB_OUTPUT"
          if [ "$HAS_DOCKERHUB" = "true" ]; then echo "${DOCKERHUB_IMAGE,,}" >> "$GITHUB_OUTPUT"; fi
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "dockerhub=${DOCKERHUB_IMAGE,,}" >> "$GITHUB_OUTPUT"
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        env:
          # The revision and date also go on the multi-arch index, so a
          # running DNServ can see what's newest with one small request
          # (Updates page).
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.names.outputs.images }}
          # Never move :latest from a release build: a release can be older
          # than main's newest commit.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ github.ref_name }}-${{ github.sha }}
          # The Go stage cross-compiles (see the Dockerfile), so only the
          # small Alpine stage runs under emulation for arm64. That stage
          # is always rebuilt so each image gets current Alpine fixes.
          no-cache-filters: runtime
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
      # Keep the Docker Hub page in step with docs/docker-hub.md. Needs the
      # token to have Read, Write & Delete access; if it doesn't, the image
      # is still published and only this step is marked as failed.
      - name: Update Docker Hub description
        if: env.HAS_DOCKERHUB == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.names.outputs.dockerhub }}
          short-description: Ad, tracker and malware blocking DNS server for homes and small businesses, with clustering and a web dashboard.
          readme-filepath: docs/docker-hub.md
